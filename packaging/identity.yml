schema: open-cli-identity/v1
repo: codereview-cli
binary: cr
service_name: codereview
goreleaser_config: .goreleaser.yml
tag:
  prefix: v
  version_scheme: major_minor_run_patch
archives:
  name_template: "cr_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# No `packages:` section by design — codereview-cli currently ships only the
# GitHub-release archives. packaging/{chocolatey,winget} are README stubs, not
# implemented channels; declaring them would make identity-check require real
# nuspec/winget manifests and run secretless channel jobs. Channels (and the
# homebrew canonical_cask) are added when each is actually implemented.

# cr's statedir-based config path resolves through os.UserConfigDir(); on macOS
# with hermetic HOME that is "$HOME/Library/Application Support". The shared
# darwin gate's native_user_config seed base writes under that root without
# path traversal.
keychain_probe:
  env_unset: [CODEREVIEW_KEYRING_BACKEND]
  seed_config:
    base: native_user_config
    path: "codereview/config.yml"
    content: |
      default_profile: default
      profiles:
        default:
          git:
            host: github.com
            auth_mode: pat
            credential_ref: codereview/default
          llm:
            provider: anthropic
            auth: subscription
            adapter: claude_cli
  command: ["config", "show", "--json"]
  output: json
  assertions:
    .backend: keychain
    .backend_source: auto
    .credential_ref: codereview/default

version_file: version.txt
