schema: open-cli-identity/v1
repo: codereview-cli
binary: cr
service_name: codereview
goreleaser_config: .goreleaser.yml
tag:
  prefix: v
  version_scheme: major_minor_run_patch
archives:
  name_template: "cr_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"

packages:
  # Homebrew's core cask tap already owns a disabled `cr` cask for Cool Reader,
  # so the shared tap uses the repo name to avoid a user-facing token collision.
  homebrew: { canonical_cask: codereview-cli }
  winget: { id: OpenCLICollective.codereview-cli, bootstrap: true }
  chocolatey: { id: codereview-cli }
  linux: { package_name: cr }

# cr's statedir-based config path resolves through os.UserConfigDir(); on macOS
# with hermetic HOME that is "$HOME/Library/Application Support". The shared
# darwin gate's native_user_config seed base writes under that root without
# path traversal.
keychain_probe:
  env_unset: [CODEREVIEW_KEYRING_BACKEND]
  seed_config:
    base: native_user_config
    path: "codereview/config.yml"
    content: |
      repository_access:
        default-git:
          git:
            host: github.com
            auth_mode: pat
            credential:
              store: local-os
              name: codereview/default
      llm_runtimes:
        claude-cli:
          provider: anthropic
          auth: subscription
          adapter: claude_cli
      profiles:
        default:
          repository_access: default-git
          reviewer:
            kind: git_identity
          llm_runtime: claude-cli
  command: ["config", "show", "--profile", "default", "--json"]
  output: json
  assertions:
    .backend: keychain
    .backend_source: credential_store
    .credential_ref: codereview/default

version_file: version.txt
