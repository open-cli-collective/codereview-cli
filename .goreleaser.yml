version: 2

project_name: codereview-cli

before:
  hooks:
    # `make tidy` runs `go mod tidy` then fails if go.mod/go.sum changed — a
    # mutating tidy must fail the release, not proceed silently. Reusing the
    # Makefile target keeps one definition and handles the no-go.sum case.
    - make tidy
    - go test ./...

builds:
  # Darwin builds need CGO so cli-common/credstore can link the Keychain
  # backend. Linux and Windows stay CGO-off/static.
  - id: cr-darwin
    main: ./cmd/cr
    binary: cr
    # Standard shipped build tags: enable 1Password support, disable passage.
    flags:
      - -tags=keyring_nopassage
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: darwin
        goarch: amd64
        goamd64: v1
        env:
          - CGO_ENABLED=1
          - "CC=xcrun clang -arch x86_64"
      - goos: darwin
        goarch: arm64
        goarm64: v8.0
        env:
          - CGO_ENABLED=1
          - "CC=xcrun clang -arch arm64"
    ldflags:
      - -s -w
      - -X github.com/open-cli-collective/codereview-cli/internal/version.Version={{.Version}}
      - -X github.com/open-cli-collective/codereview-cli/internal/version.Commit={{.Commit}}
      - -X github.com/open-cli-collective/codereview-cli/internal/version.Date={{.Date}}
    # macOS code-signing — stable DR avoids ad-hoc identity churn, but self-signed
    # builds still need the shared Keychain prompt mitigations described in
    # cli-common/docs/distribution.md §2A. Logic + identity live in open-cli-collective/.github
    # (macos-codesign-setup), which exports CODESIGN_DARWIN_SCRIPT (absolute). Unset in
    # local builds → signing skipped.
    hooks:
      post:
        - cmd: bash -c 'f="${CODESIGN_DARWIN_SCRIPT:-}"; if [ -z "$f" ]; then echo "skip codesign (CODESIGN_DARWIN_SCRIPT unset, local build)"; exit 0; fi; [ -x "$f" ] || { echo "CODESIGN_DARWIN_SCRIPT not executable ($f)" >&2; exit 1; }; exec "$f" "$0" "$1"' "{{ .Path }}" "{{ .Os }}"
  - id: cr-unix-win
    main: ./cmd/cr
    binary: cr
    flags:
      - -tags=keyring_nopassage
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/open-cli-collective/codereview-cli/internal/version.Version={{.Version}}
      - -X github.com/open-cli-collective/codereview-cli/internal/version.Commit={{.Commit}}
      - -X github.com/open-cli-collective/codereview-cli/internal/version.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "cr_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

nfpms:
  - id: cr
    package_name: cr
    vendor: Open CLI Collective
    homepage: https://github.com/open-cli-collective/codereview-cli
    maintainer: Open CLI Collective <open-cli-collective@users.noreply.github.com>
    description: Automated pull-request review CLI
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/cr/LICENSE

homebrew_casks:
  - name: codereview-cli
    binaries: [cr]
    skip_upload: true
    repository:
      owner: open-cli-collective
      name: homebrew-tap
    homepage: https://github.com/open-cli-collective/codereview-cli
    description: Automated pull-request review CLI
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cr"]
    caveats: |
      To configure cr, follow the setup examples in the README:
        https://github.com/open-cli-collective/codereview-cli#authentication-and-setup

      Secrets are stored in the OS credential store. They are never written to
      config.yml.

checksum:
  name_template: "checksums.txt"

release:
  # Idempotent re-runs: a retried release overwrites the same assets instead of
  # erroring on "asset already exists" (release-preflight hard-requires this).
  replace_existing_artifacts: true

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "Merge pull request"
  groups:
    # match the shared conventional-commit grammar incl. scopes and `!`
    # (feat(cli):, fix(api)!:) so release-gating commits aren't dumped in Other.
    - title: Features
      regexp: '^feat(\([^)]+\))?!?:'
      order: 0
    - title: Bug Fixes
      regexp: '^fix(\([^)]+\))?!?:'
      order: 1
    - title: Other
      order: 999
