name: Auto Release

# On push to main, decide whether to cut a release and mint the tag. Identity
# (tag prefix + version file) comes from packaging/identity.yml. The actual logic
# lives in the shared reusable workflow; this caller just wires triggers/secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Compute the tag but do not push it"
        type: boolean
        default: true

# The tag push uses the dedicated RELEASE_TAG_TOKEN via a credential helper, not
# GITHUB_TOKEN — so the pushed tag retriggers release.yml.
permissions:
  contents: read

jobs:
  auto-release:
    uses: open-cli-collective/.github/.github/workflows/auto-release.yml@v1
    with:
      # boolean on both events: workflow_dispatch honors the input; push is live.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
    secrets:
      tag-token: ${{ secrets.RELEASE_TAG_TOKEN }}
