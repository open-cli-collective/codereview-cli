name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Standard keyring tags for shipped builds: enable 1Password, disable passage.
env:
  GOFLAGS: -tags=keyring_nopassage

jobs:
  build-platform:                          # OS matrix — NOT a required check
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: open-cli-collective/.github/actions/go-build@b6382514b809d960c6fbdc85745a60c14cde04f1 # shared .github
        with:
          go-version-file: go.mod

  build:                                   # required aggregate — stable bare name
    needs: [build-platform]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # Fail only on a real failure/cancellation; a skipped leg must NOT fail
      # the gate (which `== 'success'` would do).
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: echo "::error::a build-platform leg failed or was cancelled" && exit 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: open-cli-collective/.github/actions/go-test@b6382514b809d960c6fbdc85745a60c14cde04f1 # shared .github
        with:
          go-version-file: go.mod

  test-no1password-optout:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=keyring_nopassage,keyring_no1password
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: open-cli-collective/.github/actions/go-test@b6382514b809d960c6fbdc85745a60c14cde04f1 # shared .github
        with:
          go-version-file: go.mod

  static-smoke:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -tags=keyring_nopassage
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: open-cli-collective/.github/actions/go-test@b6382514b809d960c6fbdc85745a60c14cde04f1 # shared .github
        with:
          go-version-file: go.mod
          target: test-static-smoke

  pi-runtime:                              # installed Pi RPC runtime gate — not a required check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3            # Pi 1.0 requires Node >= 22.19.0
      # The Makefile owns the Pi version; test-pi-runtime fails if it differs.
      # Read it first so a failed lookup stops the step instead of installing
      # an unpinned (latest) Pi.
      - run: |
          pi_version="$(make -s pi-runtime-version)"
          npm install -g --ignore-scripts "@earendil-works/pi-coding-agent@${pi_version}"
      - uses: open-cli-collective/.github/actions/go-test@b6382514b809d960c6fbdc85745a60c14cde04f1 # shared .github
        with:
          go-version-file: go.mod
          target: test-pi-runtime

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: open-cli-collective/.github/actions/go-lint@b6382514b809d960c6fbdc85745a60c14cde04f1 # shared .github
        with:
          go-version-file: go.mod

  identity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: open-cli-collective/.github/actions/identity-check@b6382514b809d960c6fbdc85745a60c14cde04f1 # shared .github; distribution.md §8.2

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: open-cli-collective/.github/actions/pr-title@b6382514b809d960c6fbdc85745a60c14cde04f1 # shared .github
        with:
          title: ${{ github.event.pull_request.title }}
